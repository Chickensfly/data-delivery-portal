<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Data Delivery Portal</title>
<!--
  Prototype data delivery portal for the DPR API.
  Single self-contained file: no external fonts, scripts or CDNs, so nothing
  here depends on a Google (or any other) host being reachable from China.
  Open it from disk or host it anywhere; the API allows any origin.
  Append ?mock=1 to the URL to run against fake data without the API.
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a1d23; --muted: #626b78;
    --border: #dde1e7; --accent: #1f5fd1; --accent-text: #ffffff;
    --ok: #177a3e; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7;
    --warn: #8a5a00; --warn-bg: #fdf3dc; --hover: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1b1e24; --text: #e6e8eb; --muted: #9aa3ae;
      --border: #2e333b; --accent: #6b9cff; --accent-text: #0d1117;
      --ok: #6fd08f; --ok-bg: #16301f; --bad: #ff8a80; --bad-bg: #3a1a18;
      --warn: #f2c14e; --warn-bg: #3a2e12; --hover: #242830;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  header.bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header.bar .brand { font-weight: 650; margin-right: auto; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  nav button.active { background: var(--hover); color: var(--text); font-weight: 600; }
  .who { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  .login { max-width: 380px; margin: 10vh auto 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li button {
    width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px;
    border-radius: 6px; cursor: pointer;
  }
  .list li button:hover { background: var(--hover); }
  .list li button.active { background: var(--hover); font-weight: 600; }
  .list .sub { display: block; font-size: 12px; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .msg { padding: 8px 12px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
  .msg.err { background: var(--bad-bg); color: var(--bad); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.info { background: var(--hover); color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.idle { background: var(--hover); color: var(--muted); }
  textarea { width: 100%; min-height: 160px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  .status { font-size: 12px; margin-top: 2px; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .crumbs { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

// ---------------------------------------------------------------------------
// Config: edit this block. COUNTRIES are the "frontend records": each key must
// match a top-level folder name in the GCS bucket exactly.
// ---------------------------------------------------------------------------
const CONFIG = {
  API_BASE: 'https://api.thesaasbot.com/api/v1',
  BUCKET: 'delivery',
  COUNTRIES: [
    { key: 'GLOBAL.BEL', name: 'Belgium' },
    { key: 'GLOBAL.HKG', name: 'Hong Kong' },
    { key: 'pak', name: 'Pakistan' },
  ],
  REQUEST_TIMEOUT_MS: 20000,
  PROBE_TIMEOUT_MS: 10000,
};

const MOCK = new URLSearchParams(location.search).has('mock');

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const state = {
  token: null, user: null,
  view: 'data',               // data | users | diag
  country: null, versions: null, version: null, files: null,
  fileStatus: {},             // object_name -> { ok, text }
  script: null,               // generated download script text
  users: null,
  diag: null,                 // [{ name, status, ms, detail }]
  log: [],                    // every API call, for the diagnostics report
  loading: {}, error: {}, notice: null,
};

const store = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} },
};

// ---------------------------------------------------------------------------
// API
// ---------------------------------------------------------------------------
class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

const FRIENDLY_ERRORS = {
  INVALID_LOGIN_CREDENTIALS: 'Incorrect email or password.',
  EMAIL_NOT_FOUND: 'Incorrect email or password.',
  INVALID_PASSWORD: 'Incorrect email or password.',
  USER_DISABLED: 'This account has been disabled.',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts. Please wait a few minutes and try again.',
};

function errorText(body, status) {
  const t = rawErrorText(body, status);
  const code = Object.keys(FRIENDLY_ERRORS).find(k => t.includes(k));
  return code ? FRIENDLY_ERRORS[code] : t;
}

function rawErrorText(body, status) {
  const d = body && (body.detail ?? body.message ?? body.error);
  if (Array.isArray(d)) return d.map(x => x.msg || JSON.stringify(x)).join('; ');
  if (typeof d === 'string') return d;
  if (d) return JSON.stringify(d);
  return `HTTP ${status}`;
}

async function api(method, path, body) {
  const started = performance.now();
  const entry = { at: new Date().toISOString(), method, path, status: null, ms: null, error: null };
  state.log.push(entry);
  if (state.log.length > 200) state.log.shift();
  try {
    const res = MOCK ? await mockApi(method, path, body) : await timedFetch(CONFIG.API_BASE + path, {
      method,
      headers: {
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    }, CONFIG.REQUEST_TIMEOUT_MS);
    entry.status = res.status;
    let json = null;
    try { json = await res.json(); } catch {}
    entry.ms = Math.round(performance.now() - started);
    if (!res.ok) {
      entry.error = errorText(json, res.status);
      // This API answers a missing token with 401 but an invalid/expired one with 403 "Invalid token".
      const sessionDead = res.status === 401 || (res.status === 403 && /invalid token|expired/i.test(entry.error));
      if (sessionDead && state.token) { signOut('Your session has expired. Please sign in again.'); }
      throw new ApiError(entry.error, res.status);
    }
    if (json && json.success === false) throw new ApiError(json.message || 'Request failed', res.status);
    return json && 'data' in json ? json.data : json;
  } catch (e) {
    entry.ms = entry.ms ?? Math.round(performance.now() - started);
    if (e instanceof ApiError) throw e;
    if (e.name === 'AbortError') {
      entry.error = 'timed out';
      throw new ApiError(`The server did not respond within ${CONFIG.REQUEST_TIMEOUT_MS / 1000}s.`, 0);
    }
    // The browser hides why a request failed. If the server answers a plain
    // request, it was reachable and the response was blocked (typically a
    // server error sent without CORS headers), not a network outage.
    if (await apiReachable()) {
      entry.error = 'response blocked by browser (server reachable; likely a server error without CORS headers)';
      throw new ApiError('The server responded, but the browser blocked the response. This is usually a server-side error on this request.', 0);
    }
    entry.error = `network error: ${e.message}`;
    throw new ApiError('Could not reach the server. Check your connection.', 0);
  }
}

async function apiReachable() {
  try { await timedFetch(CONFIG.API_BASE + '/dpr-auth/me', { mode: 'no-cors', cache: 'no-store' }, 5000); return true; }
  catch { return false; }
}

async function timedFetch(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

const enc = encodeURIComponent;
const bucketQ = `bucket=${enc(CONFIG.BUCKET)}`;

// Response shapes are read defensively: the guide names fields but not every wrapper.
function pickArray(data, ...keys) {
  if (Array.isArray(data)) return data;
  for (const k of keys) if (data && Array.isArray(data[k])) return data[k];
  return [];
}

const Api = {
  login: (email, password) => api('POST', '/dpr-auth/login', { email, password }),
  versions: key => api('GET', `/dpr-service/gcs/${enc(key)}/versions?${bucketQ}`)
    .then(d => pickArray(d, 'versions')),
  files: (key, v) => api('GET', `/dpr-service/gcs/${enc(key)}/versions/${enc(v)}/files?${bucketQ}`)
    .then(d => pickArray(d, 'files', 'items', 'objects')),
  signedUrl: (key, v, objectName) => api('POST', '/dpr-service/gcs/signed-url',
    { country_key: key, version: v, object_name: objectName, bucket: CONFIG.BUCKET }),
  users: () => api('GET', '/dpr-service/users').then(d => pickArray(d, 'users', 'items')),
  register: u => api('POST', '/dpr-auth/register', u),
  patchUser: (id, patch) => api('PATCH', `/dpr-service/users/${enc(id)}`, patch),
};

// ---------------------------------------------------------------------------
// Session
// ---------------------------------------------------------------------------
function jwtExp(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; }
  catch { return null; }
}

function restoreSession() {
  const s = store.get('session');
  if (!s || !s.token) return;
  const exp = jwtExp(s.token);
  if (exp && exp < Date.now()) { store.del('session'); return; }
  state.token = s.token; state.user = s.user;
}

async function signIn(email, password) {
  const d = await Api.login(email, password);
  const token = d.id_token || d.idToken || d.token;
  if (!token) throw new ApiError('Login succeeded but no id_token was returned.', 200);
  state.token = token;
  state.user = { ...(d.user || {}), id: (d.user && d.user.id) || d.local_id, email: (d.user && d.user.email) || email };
  store.set('session', { token: state.token, user: state.user });
}

function signOut(notice) {
  state.token = null; state.user = null;
  Object.assign(state, { country: null, versions: null, version: null, files: null, users: null, fileStatus: {}, script: null });
  store.del('session');
  state.notice = notice || null;
  state.view = 'data';
  render();
}

const isAdmin = () => state.user && state.user.role === 'admin';

// Countries a user may see: their own country_keys if set, else all configured.
function userCountryKeys(u) {
  const raw = u && (u.country_keys ?? u.countries);
  if (Array.isArray(raw)) return raw.filter(Boolean);
  if (typeof raw === 'string') return raw.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}

function visibleCountries() {
  const own = userCountryKeys(state.user);
  const byKey = new Map(CONFIG.COUNTRIES.map(c => [c.key, c]));
  const list = own.length && !isAdmin()
    ? own.map(k => byKey.get(k) || { key: k, name: k })
    : CONFIG.COUNTRIES.slice();
  if (state.country && !list.some(c => c.key === state.country)) list.push({ key: state.country, name: state.country });
  return list;
}

// ---------------------------------------------------------------------------
// Data actions
// ---------------------------------------------------------------------------
async function withLoading(key, fn) {
  state.loading[key] = true; state.error[key] = null; render();
  try { return await fn(); }
  catch (e) { state.error[key] = e.message; }
  finally { state.loading[key] = false; render(); }
}

function selectCountry(key) {
  Object.assign(state, { country: key, versions: null, version: null, files: null, fileStatus: {}, script: null });
  withLoading('versions', async () => {
    const v = await Api.versions(key);
    state.versions = v.map(x => typeof x === 'string' ? x : (x.name || x.version)).sort().reverse();
  });
}

function selectVersion(v) {
  Object.assign(state, { version: v, files: null, fileStatus: {}, script: null });
  withLoading('files', async () => { state.files = await Api.files(state.country, v); });
}

// The tab is opened synchronously inside the click so popup blockers allow it,
// even when the signed-url call takes longer than the browser's activation window.
async function downloadFile(f) {
  const win = window.open('', '_blank');
  if (win) {
    win.document.title = 'Preparing download…';
    win.document.body.style.font = '15px system-ui, sans-serif';
    win.document.body.textContent = `Preparing ${f.name}…`;
  }
  const t0 = performance.now();
  state.fileStatus[f.object_name] = { text: 'Requesting link…' }; render();
  try {
    const d = await Api.signedUrl(state.country, state.version, f.object_name);
    const ms = Math.round(performance.now() - t0);
    state.fileStatus[f.object_name] = { ok: true, url: d.url, text: `Link issued in ${ms} ms, valid until ${fmtTime(d.expires_at)}` };
    if (win) win.location.href = d.url; else location.href = d.url;
  } catch (e) {
    if (win) win.close();
    state.fileStatus[f.object_name] = { ok: false, text: e.message };
  }
  render();
}

async function buildScript() {
  await withLoading('script', async () => {
    const lines = [], urls = [];
    let expires = null;
    for (const f of state.files) {
      const d = await Api.signedUrl(state.country, state.version, f.object_name);
      expires = d.expires_at || expires;
      urls.push(d.url);
      lines.push(`curl -L -C - -o "${f.name.replace(/"/g, '')}" "${d.url}"`);
    }
    state.script = {
      text: [
        `# ${state.country} / ${state.version}: ${state.files.length} file(s)`,
        `# Links expire ${fmtTime(expires)}. On Windows use curl.exe instead of curl.`,
        ...lines,
      ].join('\n'),
      urls: urls.join('\n'),
    };
  });
}

// ---------------------------------------------------------------------------
// Admin actions
// ---------------------------------------------------------------------------
function loadUsers() {
  return withLoading('users', async () => { state.users = await Api.users(); });
}

async function createUser(form) {
  const keys = form.countries.value.split(',').map(s => s.trim()).filter(Boolean);
  await withLoading('create', async () => {
    await Api.register({
      email: form.email.value.trim(), password: form.password.value, name: form.name.value.trim(),
      status: 'active', ...(keys.length ? { country_keys: keys } : {}),
    });
    state.notice = `Created ${form.email.value.trim()}.`;
    form.reset();
    await Api.users().then(u => { state.users = u; });
  });
}

async function patchUser(u, patch, key) {
  await withLoading(key, async () => {
    await Api.patchUser(u.id || u.uid, patch);
    state.users = await Api.users();
  });
}

// ---------------------------------------------------------------------------
// Network diagnostics
// ---------------------------------------------------------------------------
const PROBES = [
  { id: 'api', name: 'DPR API (api.thesaasbot.com)', run: probeApi },
  { id: 'gcs', name: 'Google Cloud Storage (storage.googleapis.com)', run: () => probeNoCors('https://storage.googleapis.com/') },
  { id: 'baseline', name: 'Baseline: baidu.com (reachable in mainland China)', run: () => probeNoCors('https://www.baidu.com/favicon.ico') },
  { id: 'google', name: 'Reference: www.google.com (blocked in mainland China)', run: () => probeNoCors('https://www.google.com/favicon.ico') },
  { id: 'signed', name: 'Signed-URL download: first 1 MB of a real file', run: probeSignedUrl, needsAuth: true },
];

async function probeApi() {
  if (MOCK) return { status: 'ok', detail: 'mock' };
  const res = await timedFetch(CONFIG.API_BASE + '/dpr-auth/me', {}, CONFIG.PROBE_TIMEOUT_MS);
  return { status: res.status === 401 || res.ok ? 'ok' : 'warn', detail: `HTTP ${res.status}` };
}

// no-cors: we can't read the response, but a resolved fetch means the host answered.
async function probeNoCors(url) {
  if (MOCK) return { status: 'ok', detail: 'mock' };
  await timedFetch(url, { mode: 'no-cors', cache: 'no-store' }, CONFIG.PROBE_TIMEOUT_MS);
  return { status: 'ok', detail: 'host responded' };
}

async function probeSignedUrl() {
  if (!state.token) return { status: 'idle', detail: 'Sign in first' };
  let key = state.country, version = state.version, files = state.files;
  if (!key) {
    key = visibleCountries()[0] && visibleCountries()[0].key;
    if (!key) return { status: 'idle', detail: 'No country configured' };
  }
  if (!version) version = (await Api.versions(key)).map(x => typeof x === 'string' ? x : x.name).sort().reverse()[0];
  if (!version) return { status: 'warn', detail: `No versions under ${key}` };
  if (!files || state.version !== version) files = await Api.files(key, version);
  if (!files.length) return { status: 'warn', detail: `No files in ${key}/${version}` };
  const f = files.slice().sort((a, b) => (+a.size || 0) - (+b.size || 0))[0];
  const d = await Api.signedUrl(key, version, f.object_name);
  const host = new URL(d.url).host;
  if (MOCK) return { status: 'ok', detail: `mock (${host})` };
  const t0 = performance.now();
  try {
    const res = await timedFetch(d.url, { headers: { Range: 'bytes=0-1048575' }, cache: 'no-store' }, 30000);
    const buf = await res.arrayBuffer();
    const s = (performance.now() - t0) / 1000;
    return {
      status: res.ok ? 'ok' : 'bad',
      detail: `${host}: HTTP ${res.status}, ${fmtSize(buf.byteLength)} in ${s.toFixed(1)}s (${fmtSize(buf.byteLength / s)}/s) from ${f.name}`,
    };
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    // Bucket CORS may not allow reading the body; fall back to a reachability-only check.
    await timedFetch(d.url, { mode: 'no-cors', headers: { Range: 'bytes=0-1023' }, cache: 'no-store' }, CONFIG.PROBE_TIMEOUT_MS);
    return { status: 'warn', detail: `${host} reachable, but speed not measurable (bucket CORS blocks reading). Try a real Download.` };
  }
}

async function runDiagnostics() {
  state.diag = PROBES.map(p => ({ id: p.id, name: p.name, status: 'running', ms: null, detail: '' }));
  render();
  for (const [i, p] of PROBES.entries()) {
    const t0 = performance.now();
    let r;
    try { r = await p.run(); }
    catch (e) {
      r = { status: 'bad', detail: e.name === 'AbortError' ? `no response within ${CONFIG.PROBE_TIMEOUT_MS / 1000}s` : (e.message || 'network error') };
    }
    state.diag[i] = { ...state.diag[i], ...r, ms: Math.round(performance.now() - t0) };
    render();
  }
}

const STATUS_LABEL = { ok: 'OK', bad: 'FAILED', warn: 'PARTIAL', running: '…', idle: 'SKIPPED' };

function diagReport() {
  const lines = [
    'Data Delivery Portal: network report',
    `Time: ${new Date().toISOString()}`,
    `Time zone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`,
    `Page origin: ${location.origin === 'null' ? 'local file' : location.origin}`,
    `Signed in as: ${state.user ? `${state.user.email} (${state.user.role || 'user'})` : 'not signed in'}`,
    `Browser: ${navigator.userAgent}`,
    '',
    'Checks:',
    ...(state.diag || []).map(d => `  [${STATUS_LABEL[d.status] || d.status}] ${d.name}: ${d.ms ?? '-'} ms, ${d.detail}`),
    '',
    'API call log:',
    ...state.log.map(l => `  ${l.at} ${l.method} ${l.path} -> ${l.status ?? '-'} ${l.ms ?? '-'} ms${l.error ? ` (${l.error})` : ''}`),
  ];
  return lines.join('\n');
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

function fmtSize(n) {
  n = +n;
  if (!isFinite(n)) return '–';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i && n < 10 ? 1 : 0)} ${u[i]}`;
}

function fmtTime(iso) {
  if (!iso) return 'in 2 hours';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString();
}

const msg = (kind, text) => text ? h('div', { class: `msg ${kind}` }, text) : null;

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = h('textarea', { value: text });
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = old; }, 1500);
}

function render() {
  const app = document.getElementById('app');
  const focusedId = document.activeElement && document.activeElement.id;
  // Re-rendering replaces the DOM, so carry typed-in values across.
  const typed = {};
  app.querySelectorAll('input[id]').forEach(el => { typed[el.id] = el.value; });
  app.replaceChildren(state.token ? shell() : (state.view === 'diag' ? publicDiag() : loginView()));
  for (const [id, v] of Object.entries(typed)) { const el = document.getElementById(id); if (el && !el.value) el.value = v; }
  if (focusedId) { const el = document.getElementById(focusedId); if (el) el.focus(); }
}

function loginView() {
  const onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    state.notice = null;
    await withLoading('login', () => signIn(f.email.value.trim(), f.password.value));
  };
  return h('div', { class: 'wrap' },
    h('div', { class: 'panel login' },
      h('h2', {}, 'Data Delivery Portal'),
      h('p', { class: 'muted small' }, 'Sign in with the account you were given to access your data.'),
      MOCK ? msg('info', 'Mock mode: any email and password will work.') : null,
      msg('info', state.notice),
      msg('err', state.error.login),
      h('form', { onsubmit },
        h('label', { for: 'email' }, 'Email'),
        h('input', { id: 'email', name: 'email', type: 'email', required: true, autocomplete: 'username' }),
        h('label', { for: 'password' }, 'Password'),
        h('input', { id: 'password', name: 'password', type: 'password', required: true, autocomplete: 'current-password' }),
        h('div', { class: 'row', style: 'margin-top:16px' },
          h('button', { class: 'btn primary', type: 'submit', disabled: state.loading.login }, state.loading.login ? 'Signing in…' : 'Sign in'),
          h('span', { class: 'spacer' }),
          h('a', { href: '#', class: 'small', onclick: e => { e.preventDefault(); state.view = 'diag'; render(); } }, 'Test network'),
        ),
      ),
    ),
  );
}

function shell() {
  const tab = (id, label) => h('button', { class: state.view === id ? 'active' : '', onclick: () => {
    state.view = id; state.notice = null;
    if (id === 'users' && !state.users) loadUsers();
    render();
  } }, label);
  const body = state.view === 'users' && isAdmin() ? usersView() : state.view === 'diag' ? diagView() : dataView();
  return h('div', {},
    h('header', { class: 'bar' },
      h('span', { class: 'brand' }, 'Data Delivery Portal', MOCK ? h('span', { class: 'pill warn', style: 'margin-left:8px' }, 'MOCK') : null),
      h('nav', {}, tab('data', 'My data'), isAdmin() ? tab('users', 'Users') : null, tab('diag', 'Network test')),
      h('span', { class: 'who' }, `${state.user.email}${isAdmin() ? ' · admin' : ''}`),
      h('button', { class: 'btn small', onclick: () => signOut() }, 'Sign out'),
    ),
    h('div', { class: 'wrap' }, body),
  );
}

function dataView() {
  const countries = visibleCountries();
  const openKey = e => {
    e.preventDefault();
    const k = e.target.key.value.trim();
    if (k) selectCountry(k);
  };
  return h('div', { class: 'grid' },
    h('div', {},
      h('div', { class: 'panel' },
        h('h2', {}, 'Datasets'),
        countries.length ? h('ul', { class: 'list' }, countries.map(c =>
          h('li', {}, h('button', { class: state.country === c.key ? 'active' : '', onclick: () => selectCountry(c.key) },
            c.name, h('span', { class: 'sub mono' }, c.key))))) : h('p', { class: 'muted small' }, 'No datasets assigned.'),
        isAdmin() || !countries.length ? h('form', { onsubmit: openKey, style: 'margin-top:12px' },
          h('label', { for: 'key' }, 'Open folder key'),
          h('div', { class: 'row' },
            h('input', { id: 'key', name: 'key', type: 'text', placeholder: 'e.g. GLOBAL.BEL', style: 'flex:1;min-width:0' }),
            h('button', { class: 'btn small', type: 'submit' }, 'Go')),
        ) : null,
      ),
      state.country ? h('div', { class: 'panel' },
        h('h2', {}, 'Versions'),
        state.loading.versions ? h('p', { class: 'muted small' }, 'Loading…') : null,
        msg('err', state.error.versions),
        state.versions && !state.versions.length ? h('p', { class: 'muted small' }, 'No versions found.') : null,
        state.versions ? h('ul', { class: 'list' }, state.versions.map(v =>
          h('li', {}, h('button', { class: `mono ${state.version === v ? 'active' : ''}`, onclick: () => selectVersion(v) }, v)))) : null,
      ) : null,
    ),
    h('div', {}, filesPanel()),
  );
}

function filesPanel() {
  if (!state.country) return h('div', { class: 'panel' }, h('p', { class: 'muted' }, 'Choose a dataset to see its versions.'));
  if (!state.version) return h('div', { class: 'panel' }, h('p', { class: 'muted' }, 'Choose a version to see its files.'));
  const files = state.files || [];
  const total = files.reduce((s, f) => s + (+f.size || 0), 0);
  return h('div', {},
    h('div', { class: 'panel' },
      h('div', { class: 'crumbs mono' }, `${state.country} / ${state.version}`),
      h('div', { class: 'row', style: 'margin-bottom:8px' },
        h('h2', { style: 'margin:0' }, 'Files'),
        state.files ? h('span', { class: 'muted small' }, `${files.length} file(s), ${fmtSize(total)}`) : null,
        h('span', { class: 'spacer' }),
        files.length ? h('button', { class: 'btn small', onclick: buildScript, disabled: state.loading.script },
          state.loading.script ? 'Generating links…' : 'Get download script') : null,
      ),
      state.loading.files ? h('p', { class: 'muted small' }, 'Loading…') : null,
      msg('err', state.error.files),
      state.files && !files.length ? h('p', { class: 'muted small' }, 'This version has no files.') : null,
      files.length ? h('div', { class: 'table-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'File'), h('th', { class: 'num' }, 'Size'), h('th', {}, ''))),
        h('tbody', {}, files.map(f => {
          const st = state.fileStatus[f.object_name];
          return h('tr', {},
            h('td', {}, h('div', { class: 'mono' }, f.name),
              st ? h('div', { class: `status ${st.ok === true ? 'ok' : st.ok === false ? 'bad' : ''}` }, st.text,
                st.url ? [' · ', h('a', { href: '#', onclick: e => { e.preventDefault(); copy(st.url, e.target); } }, 'copy link')] : null) : null),
            h('td', { class: 'num' }, fmtSize(f.size)),
            h('td', { class: 'num' }, h('button', { class: 'btn small primary', onclick: () => downloadFile(f) }, 'Download')),
          );
        })),
      )) : null,
    ),
    scriptPanel(),
  );
}

function scriptPanel() {
  if (!state.script && !state.error.script) return null;
  return h('div', { class: 'panel' },
    h('h2', {}, 'Download script'),
    msg('err', state.error.script),
    state.script ? [
      h('p', { class: 'muted small' }, 'Paste into a terminal to download every file. The -C - flag resumes an interrupted download while the links are valid.'),
      h('textarea', { class: 'mono', readonly: true, value: state.script.text }),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'btn small', onclick: e => copy(state.script.text, e.target) }, 'Copy script'),
        h('button', { class: 'btn small', onclick: e => copy(state.script.urls, e.target) }, 'Copy URLs only')),
    ] : null,
  );
}

function usersView() {
  const users = state.users || [];
  return h('div', {},
    h('div', { class: 'panel' },
      h('h2', {}, 'Create customer account'),
      msg('ok', state.notice),
      msg('err', state.error.create),
      h('form', { onsubmit: e => { e.preventDefault(); createUser(e.target); } },
        h('div', { class: 'grid', style: 'grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px' },
          h('div', {}, h('label', { for: 'nu-email' }, 'Email'), h('input', { id: 'nu-email', name: 'email', type: 'email', required: true })),
          h('div', {}, h('label', { for: 'nu-name' }, 'Name'), h('input', { id: 'nu-name', name: 'name', type: 'text' })),
          h('div', {}, h('label', { for: 'nu-pw' }, 'Temporary password'), h('input', { id: 'nu-pw', name: 'password', type: 'text', required: true, minlength: 6 })),
          h('div', {}, h('label', { for: 'nu-c' }, 'Folder keys (comma separated)'), h('input', { id: 'nu-c', name: 'countries', type: 'text', placeholder: 'GLOBAL.BEL' })),
        ),
        h('div', { style: 'margin-top:12px' },
          h('button', { class: 'btn primary', type: 'submit', disabled: state.loading.create }, state.loading.create ? 'Creating…' : 'Create account')),
      ),
    ),
    h('div', { class: 'panel' },
      h('div', { class: 'row', style: 'margin-bottom:8px' },
        h('h2', { style: 'margin:0' }, 'Users'), h('span', { class: 'spacer' }),
        h('button', { class: 'btn small', onclick: loadUsers, disabled: state.loading.users }, state.loading.users ? 'Loading…' : 'Refresh')),
      msg('err', state.error.users),
      users.length ? h('div', { class: 'table-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, ['Email', 'Name', 'Role', 'Folders', 'Status', ''].map(t => h('th', {}, t)))),
        h('tbody', {}, users.map(u => {
          const id = u.id || u.uid;
          const active = u.status !== 'inactive';
          const keys = userCountryKeys(u);
          return h('tr', {},
            h('td', {}, u.email), h('td', {}, u.name || ''), h('td', {}, u.role || 'user'),
            h('td', { class: 'mono' }, keys.length ? keys.join(', ') : h('span', { class: 'muted' }, 'all')),
            h('td', {}, h('span', { class: `pill ${active ? 'ok' : 'idle'}` }, u.status || 'active')),
            h('td', { class: 'num' }, h('div', { class: 'row', style: 'justify-content:flex-end' },
              h('button', { class: 'btn small', disabled: state.loading[`k-${id}`], onclick: () => {
                const v = prompt(`Folder keys for ${u.email} (comma separated, empty = all):`, keys.join(', '));
                if (v === null) return;
                patchUser(u, { country_keys: v.split(',').map(s => s.trim()).filter(Boolean) }, `k-${id}`);
              } }, 'Folders'),
              u.role !== 'admin' ? h('button', { class: 'btn small', disabled: state.loading[`s-${id}`],
                onclick: () => patchUser(u, { status: active ? 'inactive' : 'active' }, `s-${id}`) }, active ? 'Deactivate' : 'Activate') : null,
            )),
          );
        })),
      )) : (state.users ? h('p', { class: 'muted small' }, 'No users.') : null),
    ),
  );
}

function diagPanel() {
  const running = state.diag && state.diag.some(d => d.status === 'running');
  const pill = s => h('span', { class: `pill ${{ ok: 'ok', bad: 'bad', warn: 'warn' }[s] || 'idle'}` }, STATUS_LABEL[s] || s);
  return h('div', { class: 'panel' },
    h('h2', {}, 'Network test'),
    h('p', { class: 'muted small' }, 'Checks which services this network can reach. Run it, then use "Copy report" and send the text back.',
      state.token ? '' : ' Sign in first to include a real file download check.'),
    h('div', { class: 'row', style: 'margin-bottom:12px' },
      h('button', { class: 'btn primary', onclick: runDiagnostics, disabled: running }, running ? 'Running…' : (state.diag ? 'Run again' : 'Run test')),
      state.diag && !running ? h('button', { class: 'btn', onclick: e => copy(diagReport(), e.target) }, 'Copy report') : null,
    ),
    state.diag ? h('div', { class: 'table-wrap' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, 'Check'), h('th', {}, 'Result'), h('th', { class: 'num' }, 'Time'), h('th', {}, 'Detail'))),
      h('tbody', {}, state.diag.map(d => h('tr', {},
        h('td', {}, d.name), h('td', {}, pill(d.status)),
        h('td', { class: 'num' }, d.ms == null ? '' : `${d.ms} ms`), h('td', { class: 'small' }, d.detail)))),
    )) : null,
  );
}

function diagView() { return diagPanel(); }

function publicDiag() {
  return h('div', { class: 'wrap' },
    h('p', {}, h('a', { href: '#', onclick: e => { e.preventDefault(); state.view = 'data'; render(); } }, '← Back to sign in')),
    diagPanel());
}

// ---------------------------------------------------------------------------
// Mock backend (?mock=1) for UI testing without the API
// ---------------------------------------------------------------------------
async function mockApi(method, path, body) {
  await new Promise(r => setTimeout(r, 250));
  const json = (data, status = 200) => ({ ok: status < 400, status, json: async () => (status < 400 ? { success: true, data } : { detail: data }) });
  window.__mockUsers = window.__mockUsers || [
    { id: 'u1', email: 'admin@example.com', name: 'Admin', role: 'admin', status: 'active' },
    { id: 'u2', email: 'customer@example.cn', name: 'CN Customer', role: 'user', status: 'active', country_keys: ['GLOBAL.BEL'] },
  ];
  const users = window.__mockUsers;
  let m;
  if (path === '/dpr-auth/login') {
    const u = users.find(x => x.email === body.email) || { id: 'u0', email: body.email, role: body.email.startsWith('admin') ? 'admin' : 'user', status: 'active' };
    return json({ id_token: 'mock.' + btoa(JSON.stringify({ exp: Date.now() / 1000 + 3600 })) + '.sig', local_id: u.id, user: u });
  }
  if (path === '/dpr-auth/register') { const u = { id: 'u' + (users.length + 1), role: 'user', ...body }; delete u.password; users.push(u); return json(u); }
  if ((m = path.match(/^\/dpr-service\/gcs\/([^/]+)\/versions\?/))) return json({ versions: ['v26180.000', 'v26120.000'] });
  if ((m = path.match(/^\/dpr-service\/gcs\/([^/]+)\/versions\/([^/]+)\/files/))) {
    const k = decodeURIComponent(m[1]), v = decodeURIComponent(m[2]);
    return json({ files: ['roads.pbf', 'pois.parquet', 'README.txt'].map((n, i) => ({ name: n, object_name: `${k}/${v}/${n}`, size: [4.2e9, 8.1e8, 2048][i] })) });
  }
  if (path === '/dpr-service/gcs/signed-url') {
    return json({ url: URL.createObjectURL(new Blob([`mock contents of ${body.object_name}`], { type: 'text/plain' })), expires_at: new Date(Date.now() + 7200e3).toISOString(), expires_in_seconds: 7200 });
  }
  if (path === '/dpr-service/users' && method === 'GET') return json(users);
  if ((m = path.match(/^\/dpr-service\/users\/(.+)$/)) && method === 'PATCH') { Object.assign(users.find(u => u.id === decodeURIComponent(m[1])), body); return json({}); }
  return json('not found', 404);
}

restoreSession();
render();
